{% extends "base.html" %}
{% block title %}Create Account — Banking System{% endblock %}

{% block auth_content %}
<div class="auth-page">
    <div class="auth-container">
        <div class="auth-brand-icon">🏛</div>
        <div class="auth-brand">Banking System</div>
        <div class="auth-subtitle">Create your banking account</div>

        <div class="form-card">
            <form method="POST" action="{{ url_for('register') }}">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 4 characters" required>

                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password"
                    required>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>
        </div>

        <p>Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
    </div>
</div>
{% endblock %}
